name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fpm:
    name: fpm (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            flags: -std=f2018 -fcheck=all -fbacktrace -Wall -Wextra
          - profile: release
            flags: -std=f2018 -O3

    steps:
      - uses: actions/checkout@v6

      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: "14"

      - uses: fortran-lang/setup-fpm@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check source manifests
        run: python3 config/check-manifests.py

      - name: Build and run Test Drive suite
        run: >-
          fpm test
          --profile ${{ matrix.profile }}
          --flag "${{ matrix.flags }}"

      - name: Smoke-test public examples
        run: |
          fpm run --profile ${{ matrix.profile }} --example basic -- input.dat --threads 2 --verbose
          fpm run --profile ${{ matrix.profile }} --example subcommands -- --verbose run input.dat --dry-run
          fpm run --profile ${{ matrix.profile }} --example library_mode

  build-system:
    name: ${{ matrix.system }} (GNU)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system: [cmake, meson]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: "14"

      - name: Install build tools
        run: python -m pip install cmake meson ninja

      - name: Check source manifests
        run: python3 config/check-manifests.py

      - name: Configure CMake
        if: matrix.system == 'cmake'
        run: >-
          cmake -S . -B _build -GNinja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/_dist"
          -DCMAKE_INSTALL_LIBDIR=lib

      - name: Build, test, and install with CMake
        if: matrix.system == 'cmake'
        run: |
          cmake --build _build --parallel 2
          ctest --test-dir _build --output-on-failure
          cmake --install _build

      - name: Consume installed CMake package
        if: matrix.system == 'cmake'
        run: |
          cmake -S test/package -B _consumer -GNinja -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/_dist"
          cmake --build _consumer
          ctest --test-dir _consumer --output-on-failure

      - name: Configure Meson
        if: matrix.system == 'meson'
        run: >-
          meson setup _build
          --buildtype=debug
          --prefix="$GITHUB_WORKSPACE/_dist"
          --libdir=lib

      - name: Build, test, and install with Meson
        if: matrix.system == 'meson'
        run: |
          meson compile -C _build
          meson test -C _build --print-errorlogs
          meson install -C _build

      - name: Consume installed pkg-config package
        if: matrix.system == 'meson'
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/_dist/lib/pkgconfig
        run: |
          meson setup test/package _consumer
          meson compile -C _consumer
          meson test -C _consumer --print-errorlogs

  documentation:
    name: documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: sphinx-build -W -b html docs/source docs/build/html
