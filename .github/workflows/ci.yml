name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: pre-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install 'pre-commit>=4,<5'

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

  coverage:
    name: coverage (GNU)
    runs-on: ubuntu-latest
    # Codecov authenticates the upload through GitHub OIDC, so no
    # CODECOV_TOKEN secret is needed.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: "14"

      - name: Install coverage tools
        run: python -m pip install cmake ninja 'gcovr>=8.6,<9'

      - name: Configure coverage build
        run: >-
          cmake -S . -B _coverage -GNinja
          -DCMAKE_Fortran_COMPILER="$FC"
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_Fortran_FLAGS="--coverage -O0"

      - name: Build and run tests with coverage
        run: |
          cmake --build _coverage --parallel 2
          ctest --test-dir _coverage --output-on-failure

      # gfortran names module procedures `__module_MOD_name`; without
      # --include-internal-functions gcovr treats them as compiler internals
      # and drops (8.6) or crashes on (8.7) almost every line of src/.
      - name: Generate coverage report
        run: >-
          gcovr --root . --filter src/
          --gcov-executable gcov-14
          --include-internal-functions
          --xml-pretty --output _coverage/coverage.xml
          --print-summary _coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: _coverage/coverage.xml
          disable_search: true
          # Pull requests from forks get no OIDC token.
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

  fpm:
    name: fpm (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            flags: -std=f2018 -fcheck=all -fbacktrace -Wall -Wextra -Wcharacter-truncation -Werror=character-truncation
          - profile: release
            flags: -std=f2018 -O3

    steps:
      - uses: actions/checkout@v6

      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: "14"

      - uses: fortran-lang/setup-fpm@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check source manifests
        run: python3 config/check-manifests.py

      - name: Build and run Test Drive suite
        run: >-
          fpm test
          --profile ${{ matrix.profile }}
          --flag "${{ matrix.flags }}"

      - name: Smoke-test public examples
        run: |
          fpm run --profile ${{ matrix.profile }} --example basic -- input.dat --threads 2 --verbose
          fpm run --profile ${{ matrix.profile }} --example subcommands -- --verbose run input.dat --dry-run
          fpm run --profile ${{ matrix.profile }} --example library_mode

  build-system:
    name: ${{ matrix.system }} (GNU)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system: [cmake, meson]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: "14"

      - name: Install build tools
        run: python -m pip install cmake meson ninja

      - name: Check source manifests
        run: python3 config/check-manifests.py

      - name: Configure CMake
        if: matrix.system == 'cmake'
        run: >-
          cmake -S . -B _build -GNinja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/_dist"
          -DCMAKE_INSTALL_LIBDIR=lib

      - name: Build, test, and install with CMake
        if: matrix.system == 'cmake'
        run: |
          cmake --build _build --parallel 2
          ctest --test-dir _build --output-on-failure
          cmake --install _build

      - name: Consume installed CMake package
        if: matrix.system == 'cmake'
        run: |
          cmake -S test/package -B _consumer -GNinja -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/_dist"
          cmake --build _consumer
          ctest --test-dir _consumer --output-on-failure

      - name: Consume fclap as a CMake subproject
        if: matrix.system == 'cmake'
        run: |
          cmake -S test/subproject -B _subproject -GNinja
          cmake --build _subproject
          ctest --test-dir _subproject --output-on-failure

      - name: Configure Meson
        if: matrix.system == 'meson'
        run: >-
          meson setup _build
          --buildtype=debug
          --prefix="$GITHUB_WORKSPACE/_dist"
          --libdir=lib

      - name: Build, test, and install with Meson
        if: matrix.system == 'meson'
        run: |
          meson compile -C _build
          meson test -C _build --print-errorlogs
          meson install -C _build

      - name: Consume installed pkg-config package
        if: matrix.system == 'meson'
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/_dist/lib/pkgconfig
        run: |
          meson setup test/package _consumer
          meson compile -C _consumer
          meson test -C _consumer --print-errorlogs

  sanitizers:
    name: sanitizers (GNU, ASan+UBSan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: "14"

      - name: Install build tools
        run: python -m pip install cmake ninja

      # High mmap randomization on current runner kernels breaks ASan's
      # shadow-memory layout.
      - name: Allow AddressSanitizer shadow memory
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build and test with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          cmake -S . -B _asan -GNinja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_Fortran_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fcheck=all" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build _asan
          ctest --test-dir _asan --output-on-failure

  portability:
    name: fpm (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    # Jobs without a passing CI history report without blocking. ifx
    # 2026.1 passes locally, including -check all; make it blocking after
    # its first green run here.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            compiler: gcc
            version: "14"
            experimental: false
          - os: windows-latest
            compiler: gcc
            version: "14"
            experimental: false
          - os: ubuntu-latest
            compiler: intel
            version: "2025.2"
            experimental: true

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      # The prebuilt macOS fpm links against Homebrew gcc@12's libgfortran,
      # which the runners do not have. Build fpm from its single-file source
      # with the compiler installed above instead.
      - uses: fortran-lang/setup-fpm@v7
        if: runner.os != 'macOS'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap fpm from source
        if: runner.os == 'macOS'
        env:
          FPM_VERSION: "0.13.0"
          FPM_SHA256: 001cff6cf1145f215baa0888ba27acc06cea30a89b79d1a8be97db3fffbc8cd2
        run: |
          mkdir -p "$RUNNER_TEMP/fpm"
          cd "$RUNNER_TEMP/fpm"
          curl -fsSL -o fpm.F90 \
            "https://github.com/fortran-lang/fpm/releases/download/v$FPM_VERSION/fpm-$FPM_VERSION.F90"
          echo "$FPM_SHA256  fpm.F90" | shasum -a 256 -c -
          "$FC" -J . -o fpm fpm.F90
          echo "$RUNNER_TEMP/fpm" >> "$GITHUB_PATH"

      - name: Build and run Test Drive suite
        env:
          FPM_FC: ${{ env.FC }}
        run: fpm test

      - name: Smoke-test public examples
        env:
          FPM_FC: ${{ env.FC }}
        run: |
          fpm run --example basic -- input.dat --threads=2 -v
          fpm run --example subcommands -- --verbose run input.dat --dry-run
          fpm run --example library_mode

  flang:
    name: cmake (ubuntu, LLVM flang 20)
    runs-on: ubuntu-latest
    # Verified locally with conda-forge flang 20.1.8; make blocking after its
    # first green run here.
    continue-on-error: true

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v6

      # setup-fortran does not provide LLVM flang; conda-forge does.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: flang
          create-args: flang_linux-64=20 cmake ninja

      # The conda flang runtime lacks the quad-precision math library that
      # test-drive's real(10)/real(16) checks need; fclap uses neither kind.
      - name: Build and test with flang
        run: |
          cmake -S . -B _flang -GNinja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_Fortran_COMPILER="$CONDA_PREFIX/bin/x86_64-conda-linux-gnu-flang" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib" \
            -DTESTDRIVE_WITH_QP=OFF -DTESTDRIVE_WITH_XDP=OFF
          cmake --build _flang
          ctest --test-dir _flang --output-on-failure

  documentation:
    name: documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: doc/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r doc/requirements.txt

      - name: Build documentation
        run: sphinx-build -W -b html doc/source doc/build/html
